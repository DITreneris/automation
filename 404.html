<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,follow">
    <title>Page not found – Prompt Anatomy</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/icons/favicon.svg">
    <link rel="apple-touch-icon" href="/assets/img/icons/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0B1320">
    <link rel="stylesheet" href="/css/tokens.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: Inter, system-ui, sans-serif;
            background: var(--accent-dark, #0B1320);
            color: var(--text-on-dark, #f5f5f5);
        }
        main {
            max-width: 32rem;
            text-align: center;
        }
        h1 {
            font-size: 1.75rem;
            margin: 0 0 0.75rem;
        }
        p {
            margin: 0 0 1.5rem;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.5;
        }
        a {
            color: var(--accent-gold, #CFA73A);
        }
        .langs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem 1rem;
            justify-content: center;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <main>
        <h1>Page not found</h1>
        <p>The page you requested does not exist or has moved.</p>
        <p><a id="library-home" href="/en/">Go to the prompt library (English)</a></p>
        <nav class="langs" aria-label="Languages">
            <a href="/lt/" onclick="try{localStorage.setItem('lang','lt')}catch(e){}">Lietuvių</a>
            <a href="/en/" onclick="try{localStorage.setItem('lang','en')}catch(e){}">English</a>
            <a href="/et/" onclick="try{localStorage.setItem('lang','et')}catch(e){}">Eesti</a>
            <a href="/lv/" onclick="try{localStorage.setItem('lang','lv')}catch(e){}">Latviešu</a>
            <a href="/ja/" onclick="try{localStorage.setItem('lang','ja')}catch(e){}">日本語</a>
            <a href="/zh/" onclick="try{localStorage.setItem('lang','zh')}catch(e){}">简体中文</a>
        </nav>
    </main>
    <script>
        (function () {
            var lang = 'en';
            try {
                var stored = localStorage.getItem('lang');
                if (stored === 'lt' || stored === 'en' || stored === 'et' || stored === 'lv' || stored === 'ja' || stored === 'zh') lang = stored;
                else if (typeof navigator !== 'undefined' && navigator.language) {
                    var nav = navigator.language.toLowerCase();
                    if (nav.indexOf('lt') === 0) lang = 'lt';
                    else if (nav.indexOf('et') === 0 || nav.indexOf('ee') === 0) lang = 'et';
                    else if (nav.indexOf('lv') === 0) lang = 'lv';
                    else if (nav.indexOf('ja') === 0) lang = 'ja';
                    else if (nav.indexOf('zh') === 0) lang = 'zh';
                }
            } catch (e) {}
            var home = document.getElementById('library-home');
            if (home) home.setAttribute('href', '/' + lang + '/');
        })();
    </script>
</body>
</html>
