<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,follow">
    <title>Page not found – Prompt Anatomy</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/icons/favicon.svg">
    <link rel="apple-touch-icon" href="/assets/img/icons/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0B1320">
    <link rel="stylesheet" href="/css/tokens.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: Inter, system-ui, sans-serif;
            background: var(--accent-dark, #0B1320);
            color: var(--text-on-dark, #f5f5f5);
        }
        main {
            max-width: 32rem;
            text-align: center;
        }
        h1 {
            font-size: 1.75rem;
            margin: 0 0 0.75rem;
        }
        p {
            margin: 0 0 1.5rem;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.5;
        }
        a {
            color: var(--accent-gold, #CFA73A);
        }
        .langs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem 1rem;
            justify-content: center;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <main>
        <h1>Page not found</h1>
        <p>The page you requested does not exist or has moved.</p>
        <p><a href="/en/">Go to the prompt library (English)</a></p>
        <nav class="langs" aria-label="Languages">
            <a href="/lt/">Lietuvių</a>
            <a href="/en/">English</a>
            <a href="/et/">Eesti</a>
            <a href="/lv/">Latviešu</a>
            <a href="/ja/">日本語</a>
            <a href="/zh/">简体中文</a>
        </nav>
    </main>
</body>
</html>
